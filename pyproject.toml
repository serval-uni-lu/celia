[project]
name = "celia"
version = "0.1.0"
description = "CELIA is a Python library designed to generate counterfactual explanations for Machine Learning models trained on tabular data."
readme = "README.md"
authors = [
    { name = "Alan Paredes", email = "alan.paredes@uni.lu" }
]
requires-python = ">=3.12"
dependencies = [
    "certifai",
    "dice-ml",
    "fastjsonschema==2.21.1",
    "jsonschema==4.23.0",
    "matplotlib==3.10.1",
    "notebook>=7.4.2",
    "oceanpy>=2.0.4",
    "pandas>=2.2.3",
    "raiutils==0.4.2",
    "scikit-learn>=1.3.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
torch = ["torch>=2.8.0"]
dev = [
    "category-encoders>=2.7.0",
    "xgboost>=3.0.1",
    "pytest>=8.3.5",
    "torch>=2.8.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
certifai = { git = "https://github.com/alanpar97/CERTIFAI.git", rev = "main" }
dice-ml = { git = "https://github.com/alanpar97/DiCE.git", rev = "main" }

[dependency-groups]
dev = [
    "furo>=2025.9.25",
    "sphinx>=8.2.3",
]
