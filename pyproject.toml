[project]
name = "celia"
version = "0.1.0"
description = "CELIA is a Python library designed to generate counterfactual explanations for Machine Learning models trained on tabular data."
readme = "README.md"
authors = [
    { name = "Alan Paredes", email = "alan.paredes@uni.lu" }
]
requires-python = ">=3.12"
dependencies = [
    "certifai",
    "clear-cf",
    "dice-ml",
    "bugdoc",
    "numpy>=1.26.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.3.2",
    "statsmodels>=0.14.5",
]

[project.optional-dependencies]
torch = [
    "countergan[torch]",
    "torch>=2.8.0",
    "cchvae",
]
ocean = [
    "oceanpy>=2.0.4",
    "gurobipy>=13.0.1",
]
all = [
    "celia[torch]",
    "celia[ocean]",
    "celia[stochastic]",
]
stochastic = [
    "fastar",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
certifai = { git = "https://github.com/alanpar97/CERTIFAI.git" }
dice-ml = { git = "https://github.com/alanpar97/DiCE.git", rev = "main" }
countergan = { git = "https://github.com/alanpar97/countergan.git" }
clear-cf = { git = "https://github.com/alanpar97/clear.git" }
cchvae = { git = "https://github.com/alanpar97/c-chvae.git" }
bugdoc = { git = "https://github.com/VIDA-NYU/BugDoc.git", subdirectory = "bugdoc_api", rev = "standalone"}
fastar = { git = "https://github.com/alanpar97/FastAR.git" }

[dependency-groups]
dev = [
    "category-encoders>=2.7.0",
    "furo>=2025.9.25",
    "pytest>=8.3.5",
    "ruff>=0.14.0",
    "sphinx>=8.2.3",
    "torch>=2.8.0",
    "ty>=0.0.1a22",
    "xgboost>=3.0.1",
]
