[project]
name = "celia"
version = "0.1.0"
description = "CELIA is a Python library designed to generate counterfactual explanations for Machine Learning models trained on tabular data."
readme = "README.md"
authors = [
    { name = "Alan G. Paredes Cetina", email = "alan.paredes@uni.lu" }
]
license = "MIT"
keywords = ["counterfactual explanations", "machine learning", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "clear-cf @ git+https://github.com/alanpar97/clear.git@454630148ea547fff3a3ec76b72dd58041bb9953",
    "dice-ml @ git+https://github.com/alanpar97/DiCE.git@75bc19fe64731c1a4c0297c63d5aec3ec2abbfe6",
    "bugdoc @ git+https://github.com/VIDA-NYU/BugDoc.git@4d0f56cd28238fe0a6f8901d7d96af8b04404ed8#subdirectory=bugdoc_api",
    "numpy>=1.26.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.3.2",
    "statsmodels>=0.14.5",
]

[project.urls]
Repository = "https://github.com/serval-uni-lu/celia"
Documentation = "https://serval-uni-lu.github.io/celia/"
Issues = "https://github.com/serval-uni-lu/celia/issues"

[project.optional-dependencies]
torch = [
    "countergan[torch] @ git+https://github.com/alanpar97/countergan.git@97062763d6a74dbe90ef633692279876b666fdf4",
    "torch>=2.8.0",
    "cchvae @ git+https://github.com/alanpar97/c-chvae.git@a7875479a46327bfbf3cb1816b2b94774a86897c",
]
ocean = [
    "oceanpy>=2.0.4",
    "gurobipy>=13.0.1",
]
all = [
    "celia[torch]",
    "celia[ocean]",
    "celia[stochastic]",
]
stochastic = [
    "fastar @ git+https://github.com/alanpar97/FastAR.git@5be8f2613635abec801efbcd4c2e82d04da85a6f",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The counterfactual method packages are distributed only as git repositories,
# so dependencies must be declared as direct references
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "torch: marks tests that require PyTorch",
]
filterwarnings = [
    "ignore::statsmodels.tools.sm_exceptions.PerfectSeparationWarning",
    "ignore:overflow encountered in exp:RuntimeWarning:statsmodels",
    "ignore:divide by zero encountered in log:RuntimeWarning:statsmodels",
    "ignore:X does not have valid feature names:UserWarning:sklearn",
]

[dependency-groups]
dev = [
    "category-encoders>=2.7.0",
    "prek>=0.4.5",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "torch>=2.8.0",
    "ty>=0.0.1a22",
    "xgboost>=3.0.1",
    { include-group = "docs" },
]
docs = [
    "furo>=2025.9.25",
    "sphinx>=8.2.3",
]
