name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # Extras packages are mocked via autodoc_mock_imports in conf.py,
        # so the docs build needs only core dependencies + sphinx/furo.
        run: uv sync --no-default-groups --group docs

      - name: Build Sphinx docs
        # --no-sync: plain `uv run` would re-sync to default groups and pull in torch
        run: uv run --no-sync sphinx-build -b html docs/source docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
